{% extends "base.html" %}
{% block content %}
  <h1>Manage {{ kind_title }}</h1>

  {% if rows and rows|length > 0 %}
    <div class="card">
      {% for row in rows %}
        <div style="display:flex; align-items:center; justify-content:space-between; gap:12px; padding:8px 0; border-bottom: 1px solid var(--border);">
          <div style="flex:1; font-size:14px;">
            <span class="timestamp-display" data-timestamp="{{ row.timestamp_utc }}"></span>
            {% if row.text %}
              <span> — {{ row.text }}</span>
            {% endif %}
          </div>
          <div style="display:flex; gap:8px;">
            <a href="/manage/{{ kind }}/{{ row.id }}/edit" class="button" style="padding:8px 12px; font-size:14px;">Edit Time</a>
            <form method="post" action="/manage/{{ kind }}/{{ row.id }}/delete" onsubmit="return confirm('Are you sure?');">
              <button class="button button-warn" style="padding:8px 12px; font-size:14px;">Delete</button>
            </form>
          </div>
        </div>
      {% endfor %}
    </div>
  {% else %}
    <div class="card"><p class="muted">No entries found.</p></div>
  {% endif %}

  <div class="spacer"></div>
  <a class="button" href="/manage">← Back</a>

  <script>
    (function() {
      // Convert all UTC timestamps to local time for display
      document.querySelectorAll('.timestamp-display').forEach(function(el) {
        var utcStr = el.getAttribute('data-timestamp');
        if (!utcStr) return;
        try {
          var date = new Date(utcStr);
          var year = date.getFullYear();
          var month = String(date.getMonth() + 1).padStart(2, '0');
          var day = String(date.getDate()).padStart(2, '0');
          var hours = String(date.getHours()).padStart(2, '0');
          var minutes = String(date.getMinutes()).padStart(2, '0');
          el.textContent = year + '-' + month + '-' + day + ' ' + hours + ':' + minutes;
        } catch (e) {
          el.textContent = utcStr;
        }
      });
    })();
  </script>
{% endblock %}
