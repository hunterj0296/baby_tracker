<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Baby Tracker</title>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <script>
      (function () {
        try {
          var mm = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)');
          if (mm && mm.media && mm.media !== 'not all') {
            return; // Browser supports system theme; CSS will handle it
          }
        } catch (e) { /* no-op */ }
        var hour = new Date().getHours();
        var isLight = hour >= 6 && hour < 19; // 6am - 7pm light, else dark
        document.documentElement.setAttribute('data-theme', isLight ? 'light' : 'dark');
      })();
    </script>
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      /* Light (default) baby theme */
      :root {
        --bg: #f7fbff; /* very light baby blue */
        --fg: #0b1220;
        --muted: #6b7280;
        --accent: #22c55e;
        --warn: #f59e0b;
        --danger: #ef4444;
        --surface: #ffffff;
        --border: #dbe4f3;
        --input-bg: #ffffff;
        --button-bg: #e8f1ff; /* subtle blue */
        --primary: #8ecae6; /* baby blue */
        --secondary: #f4b6c2; /* baby pink */
        --on-primary: #0b1220;
        --on-secondary: #0b1220;
        --overlay: rgba(15, 23, 42, 0.45);
        --pee: #FEF3C7; /* pastel yellow */
        --poop: #E6C4A8; /* pastel brown */
      }
      /* System dark mode */
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0f172a;
          --fg: #e2e8f0;
          --muted: #94a3b8;
          --accent: #22c55e;
          --warn: #f59e0b;
          --danger: #ef4444;
          --surface: #111827;
          --border: #374151;
          --input-bg: #0b1220;
          --button-bg: #1f2937;
          --primary: #7cc4ff; /* brighter baby blue on dark */
          --secondary: #f4b6c2; /* baby pink */
          --on-primary: #0b1220;
          --on-secondary: #0b1220;
          --overlay: rgba(2, 6, 23, 0.7);
          --pee: #FEF3C7; /* keep pastel for contrast on dark */
          --poop: #E6C4A8; /* keep pastel for contrast on dark */
        }
      }
      /* Fallback attribute-controlled themes */
      [data-theme="light"] {
        --bg: #f7fbff;
        --fg: #0b1220;
        --muted: #6b7280;
        --surface: #ffffff;
        --border: #dbe4f3;
        --input-bg: #ffffff;
        --button-bg: #e8f1ff;
        --primary: #8ecae6;
        --secondary: #f4b6c2;
        --on-primary: #0b1220;
        --on-secondary: #0b1220;
        --overlay: rgba(15, 23, 42, 0.45);
        --pee: #FEF3C7;
        --poop: #E6C4A8;
      }
      [data-theme="dark"] {
        --bg: #0f172a;
        --fg: #e2e8f0;
        --muted: #94a3b8;
        --surface: #111827;
        --border: #374151;
        --input-bg: #0b1220;
        --button-bg: #1f2937;
        --primary: #7cc4ff;
        --secondary: #f4b6c2;
        --on-primary: #0b1220;
        --on-secondary: #0b1220;
        --overlay: rgba(2, 6, 23, 0.7);
        --pee: #FEF3C7;
        --poop: #E6C4A8;
      }
      html, body { margin: 0; padding: 0; background: var(--bg); color: var(--fg); font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
      .container { max-width: 560px; margin: 0 auto; padding: 16px; }
      h1 { font-size: 22px; margin: 16px 0 12px; font-weight: 700; text-align: center; }
      .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
      .button { display: block; text-align: center; padding: 16px; border-radius: 12px; background: var(--button-bg); color: var(--fg); text-decoration: none; font-size: 18px; font-weight: 600; border: 1px solid var(--border); }
      .button.button-tile { aspect-ratio: 1 / 1; display: flex; align-items: center; justify-content: center; padding: 0; font-size: 44px; line-height: 1; }
      .button-primary { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
      .button-secondary { background: var(--secondary); border-color: var(--secondary); color: var(--on-secondary); }
      .button-warn { background: var(--warn); border-color: var(--warn); color: var(--on-primary); }
      .button-accent { background: var(--accent); border-color: var(--accent); color: var(--on-primary); }
      .button-pee { background: var(--pee); border-color: var(--pee); color: var(--on-primary); }
      .button-poop { background: var(--poop); border-color: var(--poop); color: var(--on-primary); }
      .muted { color: var(--muted); font-size: 14px; }
      .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
      .status-green { color: var(--accent); }
      .status-yellow { color: var(--warn); }
      .status-red { color: var(--danger); }
      .spacer { height: 12px; }
      input, select { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--input-bg); color: var(--fg); font-size: 16px; height: 44px; }
      label { display: block; margin: 8px 0; font-size: 14px; color: var(--muted); }
      form .row { display: grid; grid-template-columns: 1fr; gap: 12px; }
      @media (min-width: 480px) {
        form .row { grid-template-columns: 1fr 1fr; }
        /* Keep time and unit stacked even on wider screens */
        form .row.row--time { grid-template-columns: 1fr; }
      }
      /* Always stack time and unit */
      form .row.row--time { grid-template-columns: 1fr; }
      /* Normalize iOS Safari datetime input size */
      input[type="date"],
      input[type="time"],
      input[type="datetime-local"] { -webkit-appearance: none; appearance: none; height: 44px; font-size: 16px; padding: 12px; line-height: 20px; }
      input[type="datetime-local"]::-webkit-date-and-time-value { min-height: 0; }
      /* Modal */
      .modal-overlay { position: fixed; inset: 0; background: var(--overlay); -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 1000; }
      .modal { width: 100%; max-width: 560px; }
      /* Tiny visuals */
      .mini-range { position: relative; width: 100%; height: 8px; border-radius: 9999px; background: var(--border); overflow: hidden; }
      .mini-range__band { position: absolute; top: 0; bottom: 0; left: var(--band-left, 0%); width: var(--band-width, 100%); background: var(--primary); opacity: 0.35; }
      .mini-range__marker { position: absolute; top: -2px; width: 2px; height: 12px; background: currentColor; border-radius: 2px; }
      .dots { display: flex; align-items: center; gap: 6px; }
      .dot { width: 10px; height: 10px; border-radius: 9999px; border: 1px solid var(--border); background: var(--surface); }
      .dot.dot--on { background: currentColor; border-color: currentColor; }
      .hint { font-size: 12px; color: var(--muted); margin-top: 6px; }
    </style>
  </head>
  <body>
    <div class="container">
      {% block content %}{% endblock %}
    </div>
  </body>
  </html>
